<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 48px;
      max-width: 700px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    p {
      font-size: 22px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.8;
    }

    @media (max-width: 640px) {
      .card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Support</h1>
    <p>
      For support, reach out to
      <a href="mailto:career.games.services@gmail.com">
        career.games.services@gmail.com
      </a>
    </p>
  </div>
</body>
</html>
